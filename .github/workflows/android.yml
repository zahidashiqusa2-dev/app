name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Find Project & Build APK
        run: |
          # Dhoondhein ke build.gradle ya build.gradle.kts kahan hai
          BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Koi bhi build.gradle file nahi mili! Apni repository ki files check karein."
            ls -la
            exit 1
          fi
          
          # Project ke main folder mein jayein
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project found in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Agar gradlew hai toh usey chalayein, warna direct gradle command use karein
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Native-App-Debug-APK
          path: "**/*.apk"
